name: Build Android APK (Surge Studio)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    name: Build Surge Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} ./SurgeStudio.apk \; || true

      - name: Locate Built APKs
        id: locate_apks
        run: |
          echo "=== Locating Built APKs ==="
          find . -type f -name "*.apk"
          APK_FILE=$(find . -type f -name "SurgeStudio.apk" -o -name "*app-debug.apk" | head -n 1)
          echo "Selected APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Surge Studio APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.locate_apks.outputs.apk_path != ''
        with:
          name: SurgeStudio-Android-APK
          path: ${{ steps.locate_apks.outputs.apk_path }}
          retention-days: 30

